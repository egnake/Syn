version: '3.8'

services:
  syn:
    build: .
    image: syn-framework
    container_name: syn-scanner
    # Use host network to allow stealth scans and proper port mapping
    network_mode: "host"
    # Run in interactive mode so the TUI wizard works
    stdin_open: true
    tty: true
    # Mount volumes to persist AI models, cache, and reports
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./nvd_cache.db:/app/nvd_cache.db
