services:
  syn:
    build: .
    image: syn-framework
    container_name: syn-scanner
    # Host networking allows raw-socket stealth scans on Linux hosts
    network_mode: "host"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    stdin_open: true
    tty: true
    environment:
      - SYN_CACHE_DIR=/app/cache
      - SYN_LOGS_DIR=/app/logs
      - SYN_REPORTS_DIR=/app/reports
    volumes:
      - ./syn/models:/app/syn/models
      - ./reports:/app/reports
      - ./cache:/app/cache
